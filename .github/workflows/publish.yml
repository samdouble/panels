name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0'
      - name: Restore
        run: dotnet restore Panels/Panels.csproj
      - name: Publish binaries
        run: |
          for RID in linux-x64 linux-arm64 win-x64 osx-x64; do
            dotnet publish Panels/Panels.csproj \
              -c Release -r "$RID" \
              --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false \
              -o "publish/$RID"
          done
      - name: Build release packages
        run: |
          mkdir -p release-artifacts
          for RID in linux-x64 linux-arm64; do
            case $RID in
              linux-x64)   ARCH=amd64 ;;
              linux-arm64) ARCH=arm64 ;;
            esac
            DEB_ROOT="deb-build-$ARCH"
            mkdir -p "$DEB_ROOT/usr/bin" "$DEB_ROOT/DEBIAN"
            cp "publish/$RID/Panels" "$DEB_ROOT/usr/bin/panels"
            chmod 755 "$DEB_ROOT/usr/bin/panels"
            printf 'Package: panels\nVersion: %s\nSection: utils\nPriority: optional\nArchitecture: %s\nMaintainer: samdouble\nDescription: panels\n Tool for comic/panel layout.\n' "$PACKAGE_VERSION" "$ARCH" > "$DEB_ROOT/DEBIAN/control"
            dpkg-deb --root-owner-group --build "$DEB_ROOT" "release-artifacts/Panels.${PACKAGE_VERSION}-${ARCH}.deb"
          done
          chmod 755 publish/linux-x64/Panels
          (cd publish/linux-x64 && zip -r "../../release-artifacts/Panels.${PACKAGE_VERSION}-linux-x64.zip" Panels)
          (cd publish/win-x64 && zip -r "../../release-artifacts/Panels.${PACKAGE_VERSION}-win-x64.zip" Panels.exe)
          chmod 755 publish/osx-x64/Panels
          (cd publish/osx-x64 && zip -r "../../release-artifacts/Panels.${PACKAGE_VERSION}-osx-x64.zip" Panels)
      - name: Upload release artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} release-artifacts/* --clobber
      - name: Pack and push NuGet
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: |
          dotnet pack Panels/Panels.csproj -c Release --no-restore -o ./nupkgs -p:PackageVersion=$PACKAGE_VERSION
          dotnet nuget push ./nupkgs/*.nupkg --api-key $NUGET_TOKEN --source https://api.nuget.org/v3/index.json --skip-duplicate
