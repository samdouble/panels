name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet tool install --global dotnet-releaser --version 0.14.0
          dotnet-releaser build dotnet-releaser.toml
          dotnet-releaser publish \
            --force \
            --github-token $GITHUB_TOKEN \
            dotnet-releaser.toml

      - name: Set package version from tag
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: |
          export PACKAGE_VERSION=${GITHUB_REF#refs/tags/v}
          dotnet restore Panels/Panels.csproj
          dotnet pack Panels/Panels.csproj -c Release --no-restore -o ./nupkgs -p:PackageVersion=$PACKAGE_VERSION
          dotnet nuget push ./nupkgs/*.nupkg --api-key $NUGET_TOKEN --source https://api.nuget.org/v3/index.json --skip-duplicate
