name: Checks
on: [pull_request]

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Commitlint
        uses: wagoid/commitlint-github-action@v6
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - name: Audit
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive | tee vulnerable.out
        # test `grep -cm 1 'has the following vulnerable packages' vulnerable.out` = 0
      - name: Test
        run: |
          dotnet test
      - name: Build
        run: |
          dotnet build

  publish:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - name: Audit
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive
      - name: Test
        run: |
          dotnet test
      - name: Build
        run: |
          dotnet build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export PATH="$PATH:/root/.dotnet/tools"
          dotnet tool install --global dotnet-releaser --version 0.10.0
          if [ "$RUNNER_OS" == "Linux" ]; then
            dotnet-releaser build dotnet-releaser.unix.toml
            dotnet-releaser publish --force --github-token $GITHUB_TOKEN dotnet-releaser.unix.toml
          elif [ "$RUNNER_OS" == "Windows" ]; then
            dotnet-releaser build dotnet-releaser.windows.toml
            dotnet-releaser publish --force --github-token $GITHUB_TOKEN dotnet-releaser.windows.toml
          fi
