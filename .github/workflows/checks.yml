name: Checks
on: [pull_request]

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Commitlint
        uses: wagoid/commitlint-github-action@v6
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0'
      - name: Audit
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive | tee vulnerable.out
        # test `grep -cm 1 'has the following vulnerable packages' vulnerable.out` = 0
      - name: Test
        run: |
          dotnet test
      - name: Build
        run: |
          dotnet Build

      - name: Publish for linux-x64
        run: dotnet publish -c Release -r linux-x64 --self-contained false -o publish
      - name: Install fpm
        run: sudo gem install --no-document fpm
      - name: Package .deb
        run: |
          fpm -s dir -t deb -n panels -v 1.0.0 -C publish .
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: panels-deb
          path: "*.deb"
