name: Checks
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  checks:
    strategy:
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
        dotnet-version: ['10.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Audit
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive | tee vulnerable.out
          grep -q "has the following vulnerable packages" vulnerable.out && (echo "Vulnerable packages found!" && cat vulnerable.out && exit 1) || echo "No vulnerable packages found."
        shell: bash
      - name: Lint
        run: |
          dotnet format -v detailed
      - name: Test
        run: |
          dotnet test
      - name: Upload coverage to Coveralls
        if: matrix.os == 'ubuntu-latest'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/coverage.cobertura.xml
          format: cobertura
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          dotnet build

  executable-checks:
    strategy:
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0'
      - name: Publish and smoke test
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   RID=linux-x64 ;;
            macOS)   RID=osx-arm64 ;;
            Windows) RID=win-x64 ;;
          esac
          dotnet publish Panels/Panels.csproj \
            -c Release -r "$RID" \
            --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false \
            -o "publish/$RID"
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXE="publish/$RID/Panels.exe"
          else
            EXE="publish/$RID/Panels"
          fi
          "$EXE" validate -c Panels.Tests/Snapshot/testxml01/bd.xml
          "$EXE" generate -c Panels.Tests/Snapshot/testxml01/bd.xml -i Panels.Tests/Snapshot/testxml01/images -o comic.pdf
          test -f comic.pdf
