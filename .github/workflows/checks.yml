name: Checks
on: [pull_request]

permissions:
  contents: write
  pull-requests: write

jobs:
  checks:
    strategy:
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
        dotnet-version: ['8.0', '9.0']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Audit
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive | tee vulnerable.out
        # test `grep -cm 1 'has the following vulnerable packages' vulnerable.out` = 0
      - name: Lint
        run: |
          dotnet format -v detailed
      - name: Test
        run: |
          dotnet test
      - name: Build
        run: |
          dotnet build
      - name: Test Release dry run
        run: |
          dotnet tool install --global dotnet-releaser --version 0.13.1
          dotnet-releaser build --force dotnet-releaser.toml
