name: Checks
on: [pull_request]

permissions:
  contents: write
  pull-requests: write

jobs:
  checks:
    strategy:
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
        dotnet-version: ['7.0']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Audit
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive | tee vulnerable.out
        # test `grep -cm 1 'has the following vulnerable packages' vulnerable.out` = 0
      - name: Test
        run: |
          dotnet test
      - name: Build
        run: |
          dotnet build

  release-please-release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@main
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple
          skip-github-pull-request: true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get next version number
        run: |
          npm install -g semantic-release@24.2.7
          npx semantic-release --dry-run
          export NEXT_TAG_VERSION=$(npx semantic-release --dry-run | grep 'The next release version is' | sed -E 's/.* ([[:digit:].]+)$/\1/')
          echo "NEXT_TAG_VERSION=${NEXT_TAG_VERSION}"
      - name: Tag major and minor versions
        run: |
          echo "${{ steps.release.outputs.version }}"
          echo "v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}"
