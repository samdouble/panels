name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get release version
        uses: wemogy/get-release-version-action@v4.3.2
        id: get-release-version
        with:
          create-tag: false
          git-username: github-actions[bot]
          git-email: 41898282+github-actions[bot]@users.noreply.github.com
          mode: semantic
      - name: Set project version
        uses: vers-one/dotnet-project-version-updater@v1.7
        with:
          file: |
            "**/*.csproj", "**/*.nuspec", "**/AssemblyInfo.cs"
          version: ${{ steps.get-release-version.outputs.version }}
      - name: Create PR with version updated
        uses: googleapis/code-suggester@v4
        env:
          ACCESS_TOKEN: ${{ secrets.PAT }}
        with:
          command: pr
          upstream_repo: panels
          upstream_owner: samdouble
          description: Update csproj
          title: "chore: update csproj"
          message: "chore: update csproj"
          labels: automated pr
          branch: update-csproj
          primary: master
          force: true
          git_dir: .
          fork: false

  release-please-release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@main
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple
          skip-github-pull-request: true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Tag major and minor versions
        if: ${{ steps.release.outputs.release_created }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add gh-token "https://${{ secrets.GITHUB_TOKEN }}@github.com/samdouble/package-reputation-action.git"
          git tag -d v${{ steps.release.outputs.major }} || true
          git tag -d v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} || true
          git push origin :v${{ steps.release.outputs.major }} || true
          git push origin :v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} || true
          git tag -a v${{ steps.release.outputs.major }} -m "Release v${{ steps.release.outputs.major }}"
          git tag -a v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} -m "Release v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}"
          git push origin v${{ steps.release.outputs.major }}
          git push origin v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}

  release-please:
    runs-on: ubuntu-latest
    needs:
      - build
      - release-please-release
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.PAT }}
          release-type: simple
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master
