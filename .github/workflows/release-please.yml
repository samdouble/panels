name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get release version
        uses: wemogy/get-release-version-action@v4.3.2
        id: get-release-version
        with:
          create-tag: false
          git-username: github-actions[bot]
          git-email: 41898282+github-actions[bot]@users.noreply.github.com
          mode: semantic
      - name: Set project version
        uses: vers-one/dotnet-project-version-updater@v1.8
        with:
          file: |
            "**/*.csproj", "**/*.nuspec", "**/AssemblyInfo.cs"
          version: ${{ steps.get-release-version.outputs.version }}
      - name: Create PR with version updated
        uses: googleapis/code-suggester@v4
        env:
          ACCESS_TOKEN: ${{ secrets.PAT }}
        with:
          command: pr
          upstream_repo: panels
          upstream_owner: samdouble
          description: Update csproj
          title: "chore: update csproj"
          message: "chore: update csproj"
          labels: automated pr
          branch: update-csproj
          primary: master
          force: true
          git_dir: .
          fork: false

  release-please:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.PAT }}
          release-type: simple
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master
